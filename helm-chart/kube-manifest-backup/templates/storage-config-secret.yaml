apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-manifest-backup.fullname" . }}-storage-config-secret
  labels:
    app.kubernetes.io/name: {{ include "kube-manifest-backup.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  storage-config.json: |
    {{- $config := dict }}
    {{- $backendFound := false }}
    {{- range $backendName, $backendConfig := .Values.global }}
    {{- if and (kindIs "map" $backendConfig) (hasKey $backendConfig "type") }}
    {{- if not $backendFound }}
    {{- range $key, $value := $backendConfig }}
    {{- $_ := set $config $key $value }}
    {{- end }}
    {{- $backendFound = true }}
    {{- else }}
    {{- fail "Multiple storage backend configurations found. Please configure only one backend (s3, azure, gcs, etc.)" }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if not $backendFound }}
    {{- fail "No storage backend configuration found. Please configure one backend section (s3, azure, gcs, etc.) in the global values." }}
    {{- end }}
    {{ $config | toJson | b64enc }}
